version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: ner_link_postgis
    environment:
      POSTGRES_DB: ner_link_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ner_link_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ner_link_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_secure_password@db:5432/ner_link_db
      - REDIS_URL=redis://redis:6379/0
      - IMD_API_KEY=${IMD_API_KEY:-""}
      - BHUVAN_API_KEY=${BHUVAN_API_KEY:-""}
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ner_link_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
