<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login - NER SafeRoute</title>
<style>
  :root { --c-bg: #f5f5f7; --c-text: #1d1d1f; --c-text-2: #86868b; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
  body { background: var(--c-bg); color: var(--c-text); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 20px; }
  
  .back-btn { position: fixed; top: 16px; left: 16px; background: #fff; border: none; padding: 10px 16px; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 600; color: #1d1d1f; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; align-items: center; gap: 6px; text-decoration: none; }
  
  .icon-box { width: 72px; height: 72px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 36px; margin-bottom: 16px; border: 1.5px solid rgba(0,0,0,0.05); }
  
  .title { font-size: 26px; font-weight: 800; color: var(--c-text); margin-bottom: 4px; letter-spacing: -0.4px; }
  .subtitle { font-size: 13px; color: var(--c-text-2); font-weight: 500; margin-bottom: 6px; }
  .desc { font-size: 13.5px; color: #444; text-align: center; max-width: 300px; line-height: 1.5; margin-bottom: 32px; }

  .login-card { width: 100%; max-width: 380px; background: #fff; border-radius: 18px; padding: 28px 24px; box-shadow: 0 4px 24px rgba(0,0,0,0.07); border: 1px solid rgba(0,0,0,0.06); }
  
  .input-group { margin-bottom: 16px; }
  .input-group label { font-size: 12px; font-weight: 600; color: var(--c-text-2); display: block; margin-bottom: 6px; }
  .input-group input { width: 100%; padding: 13px 14px; font-size: 15px; border: 1.5px solid rgba(0,0,0,0.1); border-radius: 10px; background: var(--c-bg); color: var(--c-text); outline: none; }
  .input-group input:focus { border-color: var(--c-primary); }

  .btn-continue { width: 100%; padding: 15px; font-size: 16px; font-weight: 700; color: #fff; border: none; border-radius: 12px; cursor: pointer; display: block; text-align: center; text-decoration: none; margin-top: 8px; }
</style>
</head>
<body>

  <a href="/" class="back-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Back
  </a>

  <div class="icon-box" id="icon-box"></div>
  <h1 class="title" id="page-title">Login</h1>
  <p class="subtitle" id="page-subtitle"></p>
  <p class="desc" id="page-desc"></p>

  <div class="login-card">
    <div class="input-group">
      <label>EMAIL / PHONE NUMBER</label>
      <input type="text" placeholder="Enter your email or phone">
    </div>
    <div class="input-group" style="margin-bottom: 24px;">
      <label>PASSWORD</label>
      <input type="password" placeholder="Enter your password">
    </div>

    <!-- Links directly to app.html (the main application) -->
    <a href="/app.html" class="btn-continue" id="btn-continue">Continue</a>
    
    <p style="text-align: center; font-size: 11.5px; color: #98989d; margin-top: 16px;">
      Authentication will be enabled in the next step.
    </p>
  </div>

  <p style="margin-top: 28px; font-size: 11.5px; color: #98989d; text-align: center;">
    NER SafeRoute · Government of India · SIH26002
  </p>

  <script>
    const config = {
      user: { emoji: '👤', title: 'User Login', subtitle: 'General Public', color: '#0071e3', bg: 'rgba(0,113,227,0.08)', desc: 'Access safe route planning, live alerts, and hazard maps for your journey.' },
      driver: { emoji: '🚚', title: 'Driver Login', subtitle: 'Transport Operators', color: '#34c759', bg: 'rgba(52,199,89,0.08)', desc: 'Access logistics tracking, delivery routes, and critical road condition updates.' },
      officer: { emoji: '👮', title: 'Officer Login', subtitle: 'Highway Officials', color: '#ff9f0a', bg: 'rgba(255,159,10,0.08)', desc: 'Access the admin dashboard, incident approval, and field monitoring tools.' }
    };

    const params = new URLSearchParams(window.location.search);
    const role = params.get('role') || 'user';
    const cfg = config[role] || config.user;

    document.getElementById('icon-box').innerText = cfg.emoji;
    document.getElementById('icon-box').style.background = cfg.bg;
    document.getElementById('icon-box').style.borderColor = cfg.color + '33';
    
    document.getElementById('page-title').innerText = cfg.title;
    document.getElementById('page-subtitle').innerText = cfg.subtitle;
    document.getElementById('page-desc').innerText = cfg.desc;
    
    const btn = document.getElementById('btn-continue');
    btn.style.background = cfg.color;
    btn.style.boxShadow = `0 4px 16px ${cfg.color}44`;
    btn.innerText = `Continue as ${cfg.subtitle.split(' ')[0]}`;
  </script>

</body>
</html>
