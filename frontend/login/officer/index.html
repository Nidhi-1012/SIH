<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Officer Login - NER SafeRoute</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/shared/auth-theme.css">
<style>
  :root { --c-primary: #ff9f0a; --c-primary-rgb: 255, 159, 10; --c-primary-dark: #d97f00; }
</style>
</head>
<body>

  <a href="/" class="back-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Back
  </a>

  <div class="auth-shell">
    <div class="brand-panel fade-up">
      <div class="icon-box icon-box-lg">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 5-3.5 7.5-7 9-3.5-1.5-7-4-7-9V6l7-3z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
      <h1 class="title">Officer Login</h1>
      <p class="subtitle">Highway Officials</p>
      <p class="desc">Access the admin dashboard, incident approval, and field monitoring tools.</p>
    </div>

    <div class="form-panel">
      <div class="login-card fade-up" style="animation-delay:.08s">
        <div class="error-msg" id="error-msg" role="alert"></div>
        <div class="success-msg" id="success-msg" role="status"></div>

        <div class="auth-tabs" role="group" aria-label="Choose sign in or create account">
          <button type="button" class="auth-tab active" id="tab-login" aria-pressed="true" onclick="setMode('login')">Sign In</button>
          <button type="button" class="auth-tab" id="tab-signup" aria-pressed="false" onclick="setMode('signup')">Create Account</button>
        </div>

        <form id="auth-form" novalidate>
          <div class="input-group" id="email-group">
            <label for="email">OFFICER EMAIL</label>
            <div class="input-wrap">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
              <input type="email" id="email" name="email" placeholder="Enter official email" autocomplete="email">
            </div>
            <span class="field-msg"></span>
          </div>
          <div class="input-group">
            <label for="password">PASSWORD</label>
            <div class="input-wrap">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
            </div>
            <span class="field-msg"></span>
            <div class="pw-strength" id="pw-strength">
              <div class="pw-strength-bars"><span></span><span></span><span></span></div>
              <span class="pw-strength-label"></span>
            </div>
          </div>
          <div class="invite-box" id="invite-box" hidden style="margin-bottom: 24px; margin-top: 20px;">
            <label for="invite-code">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              INVITE CODE
            </label>
            <div class="input-wrap">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="4"/><path d="M11 12h9M17 9v6M20 9v6"/></svg>
              <input type="text" id="invite-code" name="invite-code" placeholder="Provided by your department" autocomplete="off">
            </div>
            <span class="field-hint">Required to create a new officer account.</span>
          </div>

          <button type="button" class="btn btn-primary" id="btn-submit" onclick="handleAuth(currentMode)" style="margin-top: 20px;">
            <span class="btn-content">
              <span class="spinner" hidden></span>
              <span class="btn-text">LOGIN TO ADMIN PORTAL</span>
              <span class="btn-arrow"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
            </span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <p class="footer-note fade-up" style="animation-delay:.16s">
    NER SafeRoute &middot; Government of India &middot; SIH26002
  </p>

  <script src="/shared/auth-ui.js"></script>
  <script>
    const SUPABASE_PROJECT_URL = "https://xtdrczsmgvjsyoeqmwvk.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0ZHJjenNtZ3Zqc3lvZXFtd3ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNzkwNjIsImV4cCI6MjEwNDY1NTA2Mn0.W235P2PkflTcUbcxhJaoz8JehpirwclHEAFR0m9De8I";
    // Guarded: if the jsdelivr CDN script failed to load (network block,
    // ad-blocker, offline), window.supabase is undefined and createClient
    // would throw — which used to kill this entire inline script silently,
    // making every button look permanently broken. Fail soft instead.
    let supabaseClient = null;
    try {
      if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_PROJECT_URL, SUPABASE_ANON_KEY);
    } catch (e) {
      supabaseClient = null;
    }

    const emailEl = document.getElementById('email');
    const passwordEl = document.getElementById('password');
    const inviteEl = document.getElementById('invite-code');
    const inviteBoxEl = document.getElementById('invite-box');
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const btnSubmit = document.getElementById('btn-submit');
    const pwStrengthEl = document.getElementById('pw-strength');
    const errorEl = document.getElementById('error-msg');
    const successEl = document.getElementById('success-msg');

    const MODE_LABEL = { login: 'LOGIN TO ADMIN PORTAL', signup: 'CREATE OFFICER ACCOUNT' };
    let currentMode = 'login';

    const inviteHint = inviteBoxEl.querySelector('.field-hint');
    function markInviteInvalid(invalid) {
      inviteBoxEl.classList.toggle('invalid', invalid);
      inviteHint.textContent = invalid
        ? 'Invite code is required to create an officer account.'
        : 'Required to create a new officer account.';
    }

    function setMode(mode) {
      currentMode = mode;
      tabLogin.classList.toggle('active', mode === 'login');
      tabSignup.classList.toggle('active', mode === 'signup');
      tabLogin.setAttribute('aria-pressed', mode === 'login');
      tabSignup.setAttribute('aria-pressed', mode === 'signup');
      btnSubmit.querySelector('.btn-text').textContent = MODE_LABEL[mode];
      // Invite code (and password strength) only apply when creating an account
      inviteBoxEl.hidden = mode !== 'signup';
      pwStrengthEl.style.display = mode === 'signup' ? '' : 'none';
      if (mode !== 'signup') markInviteInvalid(false);
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
    }
    setMode('login');

    if (!supabaseClient) {
      errorEl.textContent = 'Could not load the sign-in service. Check your connection and refresh the page.';
      errorEl.style.display = 'block';
    }

    function baseValid() {
      return isValidEmail(emailEl.value) && passwordEl.value.length >= 6;
    }

    function setButtonEnabled(enabled) { btnSubmit.disabled = !enabled; }

    const checkEmail = wireEmailField(emailEl);
    const checkPassword = wirePasswordField(passwordEl, 6);
    wirePasswordStrength(passwordEl, pwStrengthEl);
    inviteEl.addEventListener('input', () => { if (inviteEl.value.trim()) markInviteInvalid(false); });

    async function handleAuth(mode) {
      // The button is never pre-disabled before interaction — an invalid
      // submit attempt has to surface real feedback here instead of
      // silently doing nothing.
      if (!baseValid()) {
        checkEmail(true);
        checkPassword(true);
        triggerShake(btnSubmit);
        return;
      }
      if (mode === 'signup' && !inviteEl.value.trim()) {
        markInviteInvalid(true);
        triggerShake(btnSubmit);
        return;
      }
      if (!supabaseClient) {
        errorEl.textContent = 'Could not load the sign-in service. Check your connection and refresh the page.';
        errorEl.style.display = 'block';
        triggerShake(btnSubmit);
        return;
      }

      const email = emailEl.value.trim();
      const password = passwordEl.value;
      const inviteCode = inviteEl.value.trim();
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      setButtonEnabled(false);
      setButtonLoading(btnSubmit, true, mode === 'login' ? 'Signing in…' : 'Verifying invite code…');

      let succeeded = false;
      try {
        let res;
        if (mode === 'login') {
          res = await supabaseClient.auth.signInWithPassword({ email, password });
        } else {
          // Officer accounts are never self-service without a valid invite
          // code — see require role="officer" gating in backend/app/main.py
          const reg = await fetch('/api/v1/auth/register-officer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, invite_code: inviteCode })
          });
          if (!reg.ok) {
            const err = await reg.json().catch(() => ({}));
            errorEl.textContent = err.detail || 'Registration failed.';
            errorEl.style.display = 'block';
            return;
          }
          res = await supabaseClient.auth.signInWithPassword({ email, password });
        }

        if (res.error) {
          errorEl.textContent = res.error.message;
          errorEl.style.display = 'block';
        } else {
          succeeded = true;
          showSuccess(successEl, 'Signed in — redirecting…');
          setTimeout(() => { window.location.href = '/user/#admin'; }, 450);
        }
      } catch (err) {
        errorEl.textContent = 'Connection error — please check your network and try again.';
        errorEl.style.display = 'block';
      } finally {
        // On success we're mid-redirect — leave the spinner/success state
        // showing rather than snapping the button back before navigation.
        if (!succeeded) {
          setButtonLoading(btnSubmit, false);
          setButtonEnabled(true);
        }
      }
    }
  </script>

</body>
</html>
