<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Officer Login - NER SafeRoute</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --c-primary: #ff9f0a; --c-bg: #f5f5f7; --c-text: #1d1d1f; --c-text-2: #86868b; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
  body { background: var(--c-bg); color: var(--c-text); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 20px; }
  
  .back-btn { position: fixed; top: 16px; left: 16px; background: #fff; border: none; padding: 10px 16px; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 600; color: #1d1d1f; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; align-items: center; gap: 6px; text-decoration: none; }
  
  .icon-box { width: 72px; height: 72px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 36px; margin-bottom: 16px; border: 1.5px solid rgba(255,159,10,0.33); background: rgba(255,159,10,0.08); }
  
  .title { font-size: 26px; font-weight: 800; color: var(--c-text); margin-bottom: 4px; letter-spacing: -0.4px; }
  .subtitle { font-size: 13px; color: var(--c-text-2); font-weight: 500; margin-bottom: 6px; }
  .desc { font-size: 13.5px; color: #444; text-align: center; max-width: 300px; line-height: 1.5; margin-bottom: 32px; }

  .login-card { width: 100%; max-width: 380px; background: #fff; border-radius: 18px; padding: 28px 24px; box-shadow: 0 4px 24px rgba(0,0,0,0.07); border: 1px solid rgba(0,0,0,0.06); }
  
  .input-group { margin-bottom: 16px; }
  .input-group label { font-size: 12px; font-weight: 600; color: var(--c-text-2); display: block; margin-bottom: 6px; }
  .input-group input { width: 100%; padding: 13px 14px; font-size: 15px; border: 1.5px solid rgba(0,0,0,0.1); border-radius: 10px; background: var(--c-bg); color: var(--c-text); outline: none; }
  .input-group input:focus { border-color: var(--c-primary); }

  .btn { width: 100%; padding: 15px; font-size: 16px; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; display: block; text-align: center; margin-top: 8px; }
  .btn-primary { background: var(--c-primary); color: #fff; box-shadow: 0 4px 16px rgba(255,159,10,0.44); }
  .btn-guest { background: transparent; color: var(--c-text-2); font-size: 14px; font-weight: 600; text-decoration: underline; margin-top: 16px; }

  .error-msg { color: #ff3b30; font-size: 13px; font-weight: 500; text-align: center; margin-bottom: 12px; display: none; }
</style>
</head>
<body>

  <a href="/" class="back-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Back
  </a>

  <div class="icon-box">👮</div>
  <h1 class="title">Officer Login</h1>
  <p class="subtitle">Highway Officials</p>
  <p class="desc">Access the admin dashboard, incident approval, and field monitoring tools.</p>

  <div class="login-card">
    <div class="error-msg" id="error-msg"></div>

    <div class="input-group">
      <label>OFFICER EMAIL</label>
      <input type="email" id="email" placeholder="Enter official email">
    </div>
    <div class="input-group" style="margin-bottom: 24px;">
      <label>PASSWORD</label>
      <input type="password" id="password" placeholder="Enter your password">
    </div>

    <button class="btn btn-primary" onclick="handleAuth()">LOGIN TO ADMIN PORTAL</button>
    <button class="btn btn-guest" onclick="window.location.href='/user/#admin'">Bypass (Demo Mode)</button>
  </div>

  <p style="margin-top: 28px; font-size: 11.5px; color: #98989d; text-align: center;">
    NER SafeRoute · Government of India · SIH26002
  </p>

  <script>
    const SUPABASE_PROJECT_URL = "https://xtdrczsmgvjsyoeqmwvk.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0ZHJjenNtZ3Zqc3lvZXFtd3ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNzkwNjIsImV4cCI6MjEwNDY1NTA2Mn0.W235P2PkflTcUbcxhJaoz8JehpirwclHEAFR0m9De8I";
    const supabase = window.supabase.createClient(SUPABASE_PROJECT_URL, SUPABASE_ANON_KEY);

    async function handleAuth() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error-msg');
      errorEl.style.display = 'none';

      if (!email || !password) {
        errorEl.textContent = 'Please enter both email and password';
        errorEl.style.display = 'block';
        return;
      }

      const res = await supabase.auth.signInWithPassword({ email, password });
      
      if (res.error) {
        errorEl.textContent = res.error.message;
        errorEl.style.display = 'block';
      } else {
        // Success -> Go to Admin Portal
        window.location.href = '/user/#admin';
      }
    }
  </script>

</body>
</html>
