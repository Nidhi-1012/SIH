<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Driver Login - NER SafeRoute</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/shared/auth-theme.css">
<style>
  :root { --c-primary: #34c759; --c-primary-rgb: 52, 199, 89; --c-primary-dark: #1f9e43; }
</style>
</head>
<body>

  <a href="/" class="back-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Back
  </a>

  <div class="auth-shell">
    <div class="brand-panel fade-up">
      <div class="icon-box icon-box-lg">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="7.5" cy="18" r="1.7"/><circle cx="17.5" cy="18" r="1.7"/></svg>
      </div>
      <h1 class="title">Driver Login</h1>
      <p class="subtitle">Transport Operators</p>
      <p class="desc">Access logistics routes, safe delivery paths, and real-time road hazard updates.</p>
    </div>

    <div class="form-panel">
      <div class="login-card fade-up" style="animation-delay:.08s">
        <div class="error-msg" id="error-msg" role="alert"></div>
        <div class="success-msg" id="success-msg" role="status"></div>

        <div class="auth-tabs" role="group" aria-label="Choose sign in or create account">
          <button type="button" class="auth-tab active" id="tab-login" aria-pressed="true" onclick="setMode('login')">Sign In</button>
          <button type="button" class="auth-tab" id="tab-signup" aria-pressed="false" onclick="setMode('signup')">Create Account</button>
        </div>

        <form id="auth-form" novalidate>
          <div class="input-group" id="email-group">
            <label for="email">DRIVER EMAIL</label>
            <div class="input-wrap">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
              <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email">
            </div>
            <span class="field-msg"></span>
          </div>
          <div class="input-group">
            <label for="password">PASSWORD</label>
            <div class="input-wrap">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
            </div>
            <span class="field-msg"></span>
            <div class="pw-strength" id="pw-strength">
              <div class="pw-strength-bars"><span></span><span></span><span></span></div>
              <span class="pw-strength-label"></span>
            </div>
          </div>

          <div class="driver-profile-box" id="driver-profile-box" hidden style="margin-top:4px;">
            <div class="input-group">
              <label for="full-name">FULL NAME</label>
              <div class="input-wrap">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                <input type="text" id="full-name" name="full_name" placeholder="As on your driving license" autocomplete="name">
              </div>
              <span class="field-msg"></span>
            </div>
            <div class="input-group">
              <label for="phone">PHONE NUMBER</label>
              <div class="input-wrap">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" autocomplete="tel">
              </div>
              <span class="field-msg"></span>
            </div>
            <div class="input-group">
              <label for="license-number">DRIVING LICENSE NUMBER</label>
              <div class="input-wrap">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="12" r="2"/><path d="M14 10h6M14 14h4"/></svg>
                <input type="text" id="license-number" name="license_number" placeholder="e.g. MH12 20230012345" autocomplete="off">
              </div>
              <span class="field-msg"></span>
            </div>
            <div class="input-group" style="margin-bottom: 22px;">
              <label for="vehicle-number">VEHICLE REGISTRATION NUMBER</label>
              <div class="input-wrap">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="7.5" cy="18" r="1.7"/><circle cx="17.5" cy="18" r="1.7"/></svg>
                <input type="text" id="vehicle-number" name="vehicle_number" placeholder="e.g. AS01AB1234" autocomplete="off">
              </div>
              <span class="field-msg"></span>
            </div>
          </div>

          <button type="button" class="btn btn-primary" id="btn-submit" onclick="handleAuth(currentMode)">
            <span class="btn-content">
              <span class="spinner" hidden></span>
              <span class="btn-text">LOGIN</span>
              <span class="btn-arrow"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
            </span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <p class="footer-note fade-up" style="animation-delay:.16s">
    NER SafeRoute &middot; Government of India &middot; SIH26002
  </p>

  <script src="/shared/auth-ui.js"></script>
  <script>
    const SUPABASE_PROJECT_URL = "https://xtdrczsmgvjsyoeqmwvk.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0ZHJjenNtZ3Zqc3lvZXFtd3ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNzkwNjIsImV4cCI6MjEwNDY1NTA2Mn0.W235P2PkflTcUbcxhJaoz8JehpirwclHEAFR0m9De8I";
    // Guarded: if the jsdelivr CDN script failed to load (network block,
    // ad-blocker, offline), window.supabase is undefined and createClient
    // would throw — which used to kill this entire inline script silently,
    // making every button look permanently broken. Fail soft instead.
    let supabaseClient = null;
    try {
      if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_PROJECT_URL, SUPABASE_ANON_KEY);
    } catch (e) {
      supabaseClient = null;
    }

    const emailEl = document.getElementById('email');
    const passwordEl = document.getElementById('password');
    const fullNameEl = document.getElementById('full-name');
    const phoneEl = document.getElementById('phone');
    const licenseEl = document.getElementById('license-number');
    const vehicleEl = document.getElementById('vehicle-number');
    const driverProfileBoxEl = document.getElementById('driver-profile-box');
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const btnSubmit = document.getElementById('btn-submit');
    const pwStrengthEl = document.getElementById('pw-strength');
    const errorEl = document.getElementById('error-msg');
    const successEl = document.getElementById('success-msg');

    const MODE_LABEL = { login: 'LOGIN', signup: 'CREATE DRIVER ACCOUNT' };
    let currentMode = 'login';

    function setMode(mode) {
      currentMode = mode;
      tabLogin.classList.toggle('active', mode === 'login');
      tabSignup.classList.toggle('active', mode === 'signup');
      tabLogin.setAttribute('aria-pressed', mode === 'login');
      tabSignup.setAttribute('aria-pressed', mode === 'signup');
      btnSubmit.querySelector('.btn-text').textContent = MODE_LABEL[mode];
      // Password strength and the driver profile fields (name/phone/license/
      // vehicle) only apply when creating a new account, not signing in.
      pwStrengthEl.style.display = mode === 'signup' ? '' : 'none';
      driverProfileBoxEl.hidden = mode !== 'signup';
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
    }
    setMode('login');

    if (!supabaseClient) {
      errorEl.textContent = 'Could not load the sign-in service. Check your connection and refresh the page.';
      errorEl.style.display = 'block';
    }

    function formValid() {
      if (!isValidEmail(emailEl.value) || passwordEl.value.length < 6) return false;
      if (currentMode === 'signup') {
        return fullNameEl.value.trim().length > 1
          && phoneEl.value.trim().length >= 10
          && licenseEl.value.trim().length > 3
          && vehicleEl.value.trim().length > 3;
      }
      return true;
    }

    function setButtonEnabled(enabled) { btnSubmit.disabled = !enabled; }

    const checkEmail = wireEmailField(emailEl);
    const checkPassword = wirePasswordField(passwordEl, 6);
    wirePasswordStrength(passwordEl, pwStrengthEl);

    async function handleAuth(mode) {
      // The button is never pre-disabled before interaction — an invalid
      // submit attempt has to surface real feedback here instead of
      // silently doing nothing.
      if (!formValid()) {
        checkEmail(true);
        checkPassword(true);
        triggerShake(btnSubmit);
        return;
      }
      if (!supabaseClient) {
        errorEl.textContent = 'Could not load the sign-in service. Check your connection and refresh the page.';
        errorEl.style.display = 'block';
        triggerShake(btnSubmit);
        return;
      }

      const email = emailEl.value.trim();
      const password = passwordEl.value;
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      setButtonEnabled(false);
      setButtonLoading(btnSubmit, true, mode === 'login' ? 'Signing in…' : 'Creating account…');

      let succeeded = false;
      try {
        let res;
        if (mode === 'login') {
          res = await supabaseClient.auth.signInWithPassword({ email, password });
        } else {
          // Create the account server-side so `role` is set safely in
          // app_metadata (client-editable user_metadata can't be trusted for
          // authorization) — see backend/app/services/auth_service.py
          const reg = await fetch('/api/v1/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email, password, role: 'driver',
              full_name: fullNameEl.value.trim(),
              phone: phoneEl.value.trim(),
              license_number: licenseEl.value.trim(),
              vehicle_number: vehicleEl.value.trim(),
            })
          });
          if (!reg.ok) {
            const err = await reg.json().catch(() => ({}));
            errorEl.textContent = err.detail || 'Registration failed.';
            errorEl.style.display = 'block';
            return;
          }
          res = await supabaseClient.auth.signInWithPassword({ email, password });
        }

        if (res.error) {
          errorEl.textContent = res.error.message;
          errorEl.style.display = 'block';
        } else {
          succeeded = true;
          showSuccess(successEl, 'Signed in — redirecting…');
          setTimeout(() => { window.location.href = '/driver/'; }, 450);
        }
      } catch (err) {
        errorEl.textContent = 'Connection error — please check your network and try again.';
        errorEl.style.display = 'block';
      } finally {
        // On success we're mid-redirect — leave the spinner/success state
        // showing rather than snapping the button back before navigation.
        if (!succeeded) {
          setButtonLoading(btnSubmit, false);
          setButtonEnabled(true);
        }
      }
    }

    // Allow Enter key to submit whichever mode is currently active
    document.getElementById('auth-form').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleAuth(currentMode);
      }
    });
  </script>

</body>
</html>
