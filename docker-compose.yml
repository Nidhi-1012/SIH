version: '3.8'

services:
  # 1. PostGIS Database (PostgreSQL with Spatial Extensions)
  # Used to store road segments, incidents, telemetry, and run nearest-neighbor queries
  db:
    image: postgis/postgis:15-3.3
    container_name: ner_link_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: ner_link_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis (Caching & Pub/Sub)
  # Used for fast token lookups, weather data caching, and real-time WebSocket telemetry
  redis:
    image: redis:7-alpine
    container_name: ner_link_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. GraphHopper Routing Engine (Native OSM routing for NE India corridors)
  graphhopper:
    image: israelhikingmap/graphhopper:latest
    container_name: ner_link_routing
    restart: unless-stopped
    ports:
      - "8989:8989"
    volumes:
      - ./data/osm:/data
      - ./graphhopper/config.yml:/graphhopper/config.yml
    environment:
      - JAVA_OPTS=-Xmx2g -Xms1g
    command: ["-c", "/graphhopper/config.yml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8989/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  postgis_data:
  redis_data:
