version: '3.8'

services:
  # 1. PostGIS Database (PostgreSQL with Spatial Extensions)
  # Used to store road segments, incidents, telemetry, and run nearest-neighbor queries
  db:
    image: postgis/postgis:15-3.3
    container_name: ner_link_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: ner_link_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis (Caching & Pub/Sub)
  # Used for fast token lookups, weather data caching, and real-time WebSocket telemetry
  redis:
    image: redis:7-alpine
    container_name: ner_link_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. GraphHopper Routing Engine
  # Uncomment this once we download the map data (.osm.pbf file) in the next step.
  # graphhopper:
  #   image: graphhopper/graphhopper:8.0
  #   container_name: ner_link_routing
  #   ports:
  #     - "8989:8989"
  #   volumes:
  #     - ./data/osm:/data
  #   environment:
  #     - JAVA_OPTS=-Xmx2g -Xms2g

volumes:
  postgis_data:
  redis_data:
