graphhopper:
  datareader.file: "/data/north-eastern-zone-latest.osm.pbf"
  graph.location: "/data/graphhopper-cache"

  profiles:
    - name: car
      custom_model_files: [car.json]

  profiles_ch:
    - profile: car

  profiles_lm: []

  import.osm.ignored_highways: ''

  graph.encoded_values: car_access, car_average_speed, road_class, roundabout, max_speed, road_environment, ferry_speed

  prepare.min_network_size: 200
  prepare.subnetworks.threads: 1

  graph.dataaccess.default_type: RAM_STORE

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
      max_request_header_size: 50k
  request_log:
    appenders: []
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 0.0.0.0

logging:
  appenders:
    - type: console
      time_zone: UTC
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
